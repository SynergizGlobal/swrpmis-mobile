name: swr_pmis_mobile
description: "SWR-PMIS by Synergiz — South Western Railway Project Management Information System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  pretty_dio_logger: ^1.4.0
  printing: ^5.13.2
  share_plus: ^11.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/login_slides/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/swr_logo.png
  adaptive_icon_background: "#0b2f63"
  adaptive_icon_foreground: assets/brand/swr_logo.png
  remove_alpha_ios: true
