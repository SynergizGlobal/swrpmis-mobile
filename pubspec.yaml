name: swr_pmis_mobile
description: "SWR-PMIS by Synergiz — South Western Railway Project Management Information System."
publish_to: 'none'
version: 1.0.3+12

environment:
  sdk: ^3.12.2

dependencies:
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  equatable: ^2.0.7
  excel_plus: ^2.27.1
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.4.3
  firebase_remote_config: ^6.5.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  pretty_dio_logger: ^1.4.0
  printing: ^5.13.2
  share_plus: ^11.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  image_picker: ^1.2.4
  # 11.x skips kotlin-android under AGP 9 with android.builtInKotlin=false
  # (https://github.com/miguelpruivo/flutter_file_picker/issues/2002).
  file_picker: 10.3.10
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  permission_handler: ^13.0.2
  path: ^1.9.1
  webview_flutter: ^4.13.0
  pdf_combiner: ^6.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/login_slides/
    - docs/swr-pmis-privacy-policy.html

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/swr_pmis_display_logo.png
  adaptive_icon_background: "#0b2f63"
  adaptive_icon_foreground: assets/brand/swr_pmis_app_icon_mark.png
  remove_alpha_ios: true
